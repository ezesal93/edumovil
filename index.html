</main>

<!-- ================= TOAST ================= -->
<div id="toast" class="fixed bottom-6 left-4 right-4 max-w-md mx-auto z-50 bg-navy-deep text-on-primary p-3 rounded-xl shadow-xl flex items-center gap-3 translate-y-2 opacity-0 transition-all duration-300 pointer-events-none">
  <span class="material-symbols-outlined text-[22px]" id="toast-icono">check_circle</span>
  <span class="text-label-lg" id="toast-texto"></span>
</div>

<script>
// ============================================================================
// CONFIGURACIÓN
// ============================================================================
// URL de la Web App de Apps Script (Implementar > Administrar implementaciones).
// Termina en /exec. La app se publica en GitHub Pages y guarda todo ahí.
const API_URL = 'https://script.google.com/macros/s/AKfycbyD9MMO8XS0d13cOyipbjc8dIWmhzCmoJucHoBw9mChP8dBa-UDroBJFtwIQPwF8ggysw/exec';

const CONFIG_INICIAL = {
  costoViaje: 2300,
  usuarios: ['Samir', 'Feña', 'Tamara', 'Karina', 'Ezequiel']
};
const LS = { estado: 'edumovil-estado-v2', cola: 'edumovil-cola-v2', legado: 'edumovil-datos' };
const COLORES_AVATAR = ['bg-blue-vibrant', 'bg-secondary-container', 'bg-navy-deep', 'bg-orange-action', 'bg-primary-container'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

// ============================================================================
// ESTADO
// ============================================================================
// `base` = última foto recibida de la planilla. `cola` = cambios hechos en el
// teléfono que aún no llegan. Lo que se muestra es base + cola aplicada encima.
let base = leerLS(LS.estado, null) || { config: CONFIG_INICIAL, viajes: [], abonos: {}, pagos: [] };
base.abonos = base.abonos || {};
let cola = leerLS(LS.cola, []);
let usuarioActual = null;
let sincronizando = false;
let repetirSync = false;
let sinConexion = false;
let reg = {};

function leerLS(clave, defecto) {
  try { const v = localStorage.getItem(clave); return v === null ? defecto : JSON.parse(v); }
  catch (e) { return defecto; }
}
function persistir() {
  try {
    localStorage.setItem(LS.estado, JSON.stringify(base));
    localStorage.setItem(LS.cola, JSON.stringify(cola));
  } catch (e) { /* almacenamiento no disponible */ }
}
function nuevoId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// Igual que en Code.gs: un pago (total o abono) cubre primero los viajes más
// antiguos; lo que no alcanza a completar un viaje queda como abono.
function aplicarOp(s, op) {
  if (op.tipo === 'agregarViaje') {
    if (!s.viajes.some(v => v.id === op.id)) {
      s.viajes.push({ id: op.id, usuario: op.usuario, fecha: op.fecha, trayecto: op.trayecto, costo: s.config.costoViaje });
    }
  } else if (op.tipo === 'eliminarViaje') {
    s.viajes = s.viajes.filter(v => v.id !== op.viajeId);
  } else if (op.tipo === 'pagar') {
    let credito = abonoDe(s, op.usuario) + op.monto;
    const cubiertos = new Set();
    viajesDe(s, op.usuario).reverse().forEach(v => {
      if (credito >= v.costo) { credito -= v.costo; cubiertos.add(v.id); }
    });
    s.viajes = s.viajes.filter(v => !cubiertos.has(v.id));
    s.abonos[op.usuario] = credito;
    if (!s.pagos.some(p => p.id === op.id)) {
      s.pagos.unshift({ id: op.id, usuario: op.usuario, monto: op.monto, viajes: cubiertos.size, fecha: op.fecha });
    }
  }
}
function estadoVisible() {
  const s = { config: base.config, viajes: base.viajes.slice(), abonos: Object.assign({}, base.abonos), pagos: base.pagos.slice() };
  cola.forEach(op => aplicarOp(s, op));
  return s;
}
/** Viajes pendientes, el más reciente primero (el mismo día, la vuelta arriba). */
function viajesDe(s, usuario) {
  const orden = t => (t === 'Vuelta' ? 1 : 0);
  return s.viajes.filter(v => v.usuario === usuario).sort((a, b) =>
    a.fecha !== b.fecha ? (a.fecha < b.fecha ? 1 : -1) : orden(b.trayecto) - orden(a.trayecto));
}
function abonoDe(s, usuario) {
  return s.abonos[usuario] || 0;
}
function deudaDe(s, usuario) {
  const total = viajesDe(s, usuario).reduce((a, v) => a + (Number(v.costo) || 0), 0);
  return Math.max(0, total - abonoDe(s, usuario));
}
function encolar(op) {
  cola.push(op);
  persistir();
  render();
  sincronizar();
}

// ============================================================================
// COMUNICACIÓN CON APPS SCRIPT
// ============================================================================
function llamarApi(cuerpo) {
  if (!API_URL) return Promise.reject(new Error('Falta API_URL'));
  // text/plain evita el preflight CORS, que Apps Script no soporta
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  }).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

async function sincronizar() {
  if (sincronizando) { repetirSync = true; return; }
  sincronizando = true;
  const enviadas = cola.slice();
  try {
    const r = await llamarApi({ ops: enviadas });
    if (!r || !r.ok) throw new Error((r && r.error) || 'Respuesta inválida');
    const ids = new Set(enviadas.map(o => o.id));
    cola = cola.filter(o => !ids.has(o.id));
    base = r.estado;
    base.abonos = base.abonos || {};
    sinConexion = false;
    persistir();
    const rechazada = (r.resultados || []).find(x => !x.ok);
    if (rechazada) avisar(rechazada.error, 'error');
    if (usuarioActual && base.config.usuarios.indexOf(usuarioActual) === -1) vistaActual = 'inicio';
  } catch (e) {
    sinConexion = true;
  } finally {
    sincronizando = false;
    if (vistaActual === 'inicio' && usuarioActual) ir('inicio'); else render();
    if (repetirSync) { repetirSync = false; sincronizar(); }
  }
}

// ============================================================================
// NAVEGACIÓN Y RENDER
// ============================================================================
let vistaActual = 'inicio';

function ir(vista) {
  if (vista === 'inicio') usuarioActual = null;
  vistaActual = vista;
  document.getElementById('hdr-volver').classList.toggle('hidden', vista === 'inicio');
  document.querySelectorAll('.vista').forEach(el => el.classList.toggle('activa', el.id === 'v-' + vista));
  window.scrollTo(0, 0);
  render();
}
function entrar(nombre) {
  usuarioActual = nombre;
  ir('perfil');
}

function render() {
  const s = estadoVisible();
  if (vistaActual === 'inicio') renderInicio(s);
  if (vistaActual === 'perfil') renderPerfil(s);
  const aviso = document.getElementById('estado-sync');
  const mostrar = sinConexion || cola.length > 0;
  aviso.classList.toggle('hidden', !mostrar);
  aviso.className = 'text-body-sm text-center mt-6 ' + (mostrar ? '' : 'hidden ') + (sinConexion ? 'text-orange-action' : 'text-text-secondary');
  aviso.textContent = !API_URL
    ? 'Falta configurar la planilla: pega la URL /exec en API_URL dentro de index.html.'
    : sinConexion
    ? 'Sin conexión. Tus cambios están guardados en el teléfono y se enviarán solos.'
    : 'Guardando en la planilla…';
}

function renderInicio(s) {
  document.getElementById('ini-lista').innerHTML = s.config.usuarios.map((u, i) => `
    <button type="button" onclick="entrar(${attr(u)})" class="w-full text-left p-3 rounded-xl bg-surface-card shadow-sm hover:shadow-md active:scale-[0.99] transition-all flex items-center justify-between gap-2 group">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-12 h-12 rounded-full ${COLORES_AVATAR[i % COLORES_AVATAR.length]} text-on-primary flex items-center justify-center text-headline-md shadow-sm shrink-0">${esc(u.charAt(0).toUpperCase())}</div>
        <span class="text-title-md text-text-primary truncate">${esc(u)}</span>
      </div>
      <div class="w-9 h-9 rounded-lg bg-surface-muted group-hover:bg-orange-action group-hover:text-on-primary flex items-center justify-center transition-colors shrink-0">
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      </div>
    </button>`).join('');
}

function renderPerfil(s) {
  const u = usuarioActual;
  const viajes = viajesDe(s, u);
  const n = viajes.length;
  const i = s.config.usuarios.indexOf(u);

  const av = document.getElementById('per-avatar');
  av.className = 'w-14 h-14 rounded-full flex items-center justify-center text-headline-md text-on-primary shadow-md shrink-0 ' + COLORES_AVATAR[(i < 0 ? 0 : i) % COLORES_AVATAR.length];
  av.textContent = u.charAt(0).toUpperCase();
  document.getElementById('per-nombre').textContent = u;

  document.getElementById('per-tarjeta').className = 'relative overflow-hidden rounded-xl p-5 text-on-primary shadow-xl bg-gradient-to-br ' +
    (n ? 'from-orange-action to-orange-vibrant' : 'from-success-green to-emerald-600');
  document.getElementById('per-etiqueta').textContent = n ? 'Debes' : 'Estás al día';
  document.getElementById('per-deuda').textContent = clp(deudaDe(s, u));
  const abono = abonoDe(s, u);
  document.getElementById('per-cantidad').textContent = n
    ? plural(n, 'viaje') + ' sin pagar' + (abono ? ` • ya abonaste ${clp(abono)}` : '')
    : 'No tienes viajes pendientes';
  document.getElementById('per-btn-pagar').classList.toggle('hidden', n === 0);

  document.getElementById('per-lista-titulo').classList.toggle('hidden', n === 0);
  document.getElementById('per-lista').innerHTML = viajes.map(v => `
    <article class="bg-surface-card p-3 rounded-xl shadow-sm flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-full bg-primary-fixed/60 flex items-center justify-center shrink-0 text-navy-deep">
          <span class="material-symbols-outlined text-[20px]">${v.trayecto === 'Vuelta' ? 'home' : 'school'}</span>
        </div>
        <div class="min-w-0">
          <span class="text-title-md text-navy-deep font-bold block">${esc(v.trayecto || 'Viaje')}</span>
          <span class="text-body-sm text-text-secondary">${esc(nombreDia(v.fecha))} • ${esc(fechaLarga(v.fecha))}</span>
        </div>
      </div>
      <button type="button" onclick="eliminarViaje(${attr(v.id)})" aria-label="Eliminar viaje" class="w-9 h-9 rounded-full bg-surface-muted hover:bg-error-container text-text-secondary hover:text-error flex items-center justify-center transition-colors active:scale-95 shrink-0">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </article>`).join('');

  const ultimo = s.pagos.filter(p => p.usuario === u).sort((a, b) => (a.fecha < b.fecha ? 1 : -1))[0];
  document.getElementById('per-ultimo-pago').textContent = ultimo
    ? `Último pago: ${clp(ultimo.monto)} el ${fechaLarga(ultimo.fecha)}`
    : '';
}

// ============================================================================
// REGISTRAR VIAJE
// ============================================================================
function abrirHoja(id) {
  const h = document.getElementById(id);
  h.classList.remove('hidden');
  h.classList.add('flex');
  h.onclick = (e) => { if (e.target === h) cerrarHojas(); };
}
function cerrarHojas() {
  document.querySelectorAll('.hoja').forEach(h => { h.classList.add('hidden'); h.classList.remove('flex'); });
}

const OPCIONES_TRAYECTO = {
  ida: { texto: 'Ida', icono: 'school', tramos: ['Ida'] },
  vuelta: { texto: 'Vuelta', icono: 'home', tramos: ['Vuelta'] },
  ambos: { texto: 'Ida y vuelta', icono: 'sync_alt', tramos: ['Ida', 'Vuelta'] }
};

function abrirRegistro() {
  reg = { dia: inicioDia(new Date()), opcion: 'hoy', trayecto: 'ambos' };
  renderFechas();
  renderTrayectos();
  abrirHoja('hoja-registro');
}

function renderTrayectos() {
  document.getElementById('reg-trayectos').innerHTML = Object.keys(OPCIONES_TRAYECTO).map(k => {
    const o = OPCIONES_TRAYECTO[k];
    const sel = reg.trayecto === k;
    return `<button type="button" onclick="elegirTrayecto('${k}')" class="py-3 px-1 rounded-lg flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform ${sel ? 'bg-navy-deep text-on-primary shadow-sm' : 'bg-surface-muted text-navy-deep'}">
      <span class="material-symbols-outlined text-[20px] ${sel ? 'text-orange-action' : 'text-text-secondary'}">${o.icono}</span>
      <span class="text-label-lg">${o.texto}</span>
    </button>`;
  }).join('');
  const n = OPCIONES_TRAYECTO[reg.trayecto].tramos.length;
  document.getElementById('reg-btn').textContent = n === 1 ? 'Guardar 1 viaje' : `Guardar ${n} viajes`;
}
function elegirTrayecto(k) {
  reg.trayecto = k;
  renderTrayectos();
}

function renderFechas() {
  const hoy = inicioDia(new Date());
  const estilo = sel => `relative py-3 px-2 rounded-lg flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform overflow-hidden ${sel ? 'bg-navy-deep text-on-primary shadow-sm' : 'bg-surface-muted text-navy-deep'}`;
  const sub = (t, sel) => `<span class="text-label-sm uppercase tracking-wider ${sel ? 'opacity-80' : 'text-text-secondary'}">${t}</span>`;
  const otra = reg.opcion === 'otra';
  document.getElementById('reg-fechas').innerHTML = `
    <button type="button" onclick="elegirDia(0)" class="${estilo(reg.opcion === 'hoy')}">${sub('Hoy', reg.opcion === 'hoy')}<span class="text-title-md font-bold">${diaMes(hoy)}</span></button>
    <button type="button" onclick="elegirDia(1)" class="${estilo(reg.opcion === 'ayer')}">${sub('Ayer', reg.opcion === 'ayer')}<span class="text-title-md font-bold">${diaMes(sumarDias(hoy, -1))}</span></button>
    <label class="${estilo(otra)}">
      ${otra ? sub(DIAS[reg.dia.getDay()].slice(0, 3), true) + `<span class="text-title-md font-bold">${diaMes(reg.dia)}</span>`
             : '<span class="material-symbols-outlined text-[18px] text-text-secondary">event</span><span class="text-label-md">Otro día</span>'}
      <input type="date" aria-label="Elegir otro día" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" max="${isoDia(hoy)}" value="${isoDia(reg.dia)}" onclick="try { this.showPicker(); } catch (e) {}" onchange="elegirOtroDia(this.value)">
    </label>`;
}

function elegirDia(diasAtras) {
  reg.dia = sumarDias(inicioDia(new Date()), -diasAtras);
  reg.opcion = diasAtras === 0 ? 'hoy' : 'ayer';
  renderFechas();
}
function elegirOtroDia(valor) {
  if (!valor) return;
  const [a, m, d] = valor.split('-').map(Number);
  const dia = new Date(a, m - 1, d);
  const atras = Math.round((inicioDia(new Date()) - dia) / 86400000);
  if (atras < 0) { avisar('No puedes registrar un viaje en el futuro', 'error'); return; }
  if (atras <= 1) return elegirDia(atras);
  reg.dia = dia;
  reg.opcion = 'otra';
  renderFechas();
}

async function guardarViaje() {
  // solo importa el día: se guarda a mediodía para que la zona horaria no lo cambie de fecha
  const fecha = new Date(reg.dia.getFullYear(), reg.dia.getMonth(), reg.dia.getDate(), 12).toISOString();
  const tramos = OPCIONES_TRAYECTO[reg.trayecto].tramos;
  const delDia = viajesDe(estadoVisible(), usuarioActual).filter(v => isoDia(new Date(v.fecha)) === isoDia(reg.dia));
  const repetidos = tramos.filter(t => delDia.some(v => v.trayecto === t));
  cerrarHojas();
  if (repetidos.length) {
    const ok = await preguntar('¿Registrar de nuevo?',
      `Ya tienes registrada la ${repetidos.join(' y la ').toLowerCase()} del ${fechaLarga(fecha)}.`, 'Sí, registrar');
    if (!ok) return;
  }
  tramos.forEach(t => cola.push({ id: nuevoId(), tipo: 'agregarViaje', usuario: usuarioActual, fecha: fecha, trayecto: t }));
  persistir();
  render();
  sincronizar();
  avisar(tramos.length === 1 ? 'Viaje registrado' : 'Ida y vuelta registradas');
}

async function eliminarViaje(id) {
  const v = estadoVisible().viajes.find(x => x.id === id);
  if (!v) return;
  if (!await preguntar('¿Eliminar este viaje?', `${v.trayecto || 'Viaje'} del ${fechaLarga(v.fecha)}. Hazlo solo si lo registraste por error.`)) return;
  // si el viaje todavía no salió del teléfono, basta con sacarlo de la cola
  const i = cola.findIndex(o => o.tipo === 'agregarViaje' && o.id === id);
  if (i >= 0 && !sincronizando) {
    cola.splice(i, 1);
    persistir();
    render();
  } else {
    encolar({ id: nuevoId(), tipo: 'eliminarViaje', viajeId: id });
  }
  avisar('Viaje eliminado');
}

// ============================================================================
// PAGO
// ============================================================================
let pago = {};

function abrirPago() {
  const s = estadoVisible();
  const n = viajesDe(s, usuarioActual).length;
  if (!n) return;
  pago = { opcion: 'total', deuda: deudaDe(s, usuarioActual) };
  document.getElementById('pag-resumen').textContent = `Debes ${clp(pago.deuda)} (${plural(n, 'viaje')}).`;


  document.getElementById('pag-otro').value = '';
  renderPago();
  abrirHoja('hoja-pago');
}

function renderPago() {
  const opcion = (k, titulo, valor) => {
    const sel = pago.opcion === k;
    return `<button type="button" onclick="elegirPago('${k}')" class="p-3 rounded-xl text-left flex flex-col gap-1 border-2 transition-colors ${sel ? 'border-success-green bg-success-green/10' : 'border-surface-container bg-surface-card'}">
      <span class="text-label-lg text-navy-deep flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px] ${sel ? 'icon-fill text-success-green' : 'text-text-secondary'}">${sel ? 'radio_button_checked' : 'radio_button_unchecked'}</span>${titulo}
      </span>
      <span class="text-headline-md text-navy-deep pl-6">${valor}</span>
    </button>`;
  };
  document.getElementById('pag-opciones').innerHTML =
    opcion('total', 'Pagué todo', clp(pago.deuda)) +
    opcion('otro', 'Otro monto', '<span class="material-symbols-outlined text-[22px] text-text-secondary">edit</span>');
  const caja = document.getElementById('pag-otro-caja');
  caja.classList.toggle('hidden', pago.opcion !== 'otro');
  caja.classList.toggle('flex', pago.opcion === 'otro');
  actualizarBotonPago();
}

function elegirPago(k) {
  pago.opcion = k;
  renderPago();
  if (k === 'otro') document.getElementById('pag-otro').focus();
}

function montoElegido() {
  if (pago.opcion === 'total') return pago.deuda;
  return Number(document.getElementById('pag-otro').value.replace(/\D/g, '')) || 0;
}

function formatearMonto(input) {
  const n = Number(input.value.replace(/\D/g, ''));
  input.value = n ? n.toLocaleString('es-CL') : '';
  actualizarBotonPago();
}

function actualizarBotonPago() {
  const monto = montoElegido();
  const valido = monto > 0 && monto <= pago.deuda;
  const ayuda = document.getElementById('pag-otro-ayuda');
  ayuda.textContent = monto > pago.deuda
    ? `No puede ser más de lo que debes (${clp(pago.deuda)}).`
    : monto > 0 ? `Te quedarán ${clp(pago.deuda - monto)} por pagar.` : '';
  ayuda.className = 'text-body-sm ' + (monto > pago.deuda ? 'text-error' : 'text-text-secondary');
  const btn = document.getElementById('pag-btn');
  btn.disabled = !valido;
  btn.textContent = valido ? `Confirmar pago de ${clp(monto)}` : 'Escribe el monto';
  btn.className = 'w-full py-3.5 rounded-xl text-title-md font-bold transition-all ' +
    (valido ? 'bg-success-green text-on-primary shadow-md active:scale-[0.98]' : 'bg-surface-container-highest text-text-secondary cursor-not-allowed');
}

function confirmarPago() {
  const monto = montoElegido();
  if (!(monto > 0 && monto <= pago.deuda)) return;
  encolar({ id: nuevoId(), tipo: 'pagar', usuario: usuarioActual, monto: monto, fecha: new Date().toISOString() });
  cerrarHojas();
  avisar(monto === pago.deuda ? '¡Pago registrado! Quedaste al día' : `Abono de ${clp(monto)} registrado`);
}

// ============================================================================
// DIÁLOGO Y AVISOS
// ============================================================================
function preguntar(titulo, texto, textoSi) {
  return new Promise(resolver => {
    const d = document.getElementById('dialogo');
    document.getElementById('dlg-titulo').textContent = titulo;
    document.getElementById('dlg-texto').textContent = texto;
    const si = document.getElementById('dlg-si');
    si.textContent = textoSi || 'Eliminar';
    si.className = 'flex-1 py-3 rounded-xl text-on-primary text-label-lg shadow-md active:scale-95 transition-transform ' + (textoSi ? 'bg-orange-action' : 'bg-danger-red');
    d.classList.remove('hidden');
    d.classList.add('flex');
    const cerrar = (r) => {
      d.classList.add('hidden');
      d.classList.remove('flex');
      resolver(r);
    };
    document.getElementById('dlg-si').onclick = () => cerrar(true);
    document.getElementById('dlg-no').onclick = () => cerrar(false);
    d.onclick = (e) => { if (e.target === d) cerrar(false); };
  });
}

let timerToast;
function avisar(texto, tipo) {
  const error = tipo === 'error';
  const icono = document.getElementById('toast-icono');
  icono.textContent = error ? 'error' : 'check_circle';
  icono.className = 'material-symbols-outlined text-[22px] ' + (error ? 'text-danger-red' : 'text-success-green');
  document.getElementById('toast-texto').textContent = texto;
  const t = document.getElementById('toast');
  t.classList.remove('translate-y-2', 'opacity-0');
  clearTimeout(timerToast);
  timerToast = setTimeout(() => t.classList.add('translate-y-2', 'opacity-0'), 2400);
}

// ============================================================================
// FORMATO Y FECHAS
// ============================================================================
function clp(n) { return '$' + (Number(n) || 0).toLocaleString('es-CL'); }
function plural(n, palabra) { return `${n} ${palabra}${n === 1 ? '' : 's'}`; }
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
/** Argumento seguro para un onclick="fn(...)" */
function attr(valor) { return esc(JSON.stringify(valor)); }

function inicioDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function sumarDias(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function isoDia(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function capitalizar(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
function diaMes(d) {
  const m = d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', '');
  return `${d.getDate()} ${capitalizar(m)}`;
}
/** "Hoy", "Ayer" o el día de la semana */
function nombreDia(iso) {
  const d = new Date(iso);
  const atras = Math.round((inicioDia(new Date()) - inicioDia(d)) / 86400000);
  if (atras === 0) return 'Hoy';
  if (atras === 1) return 'Ayer';
  return capitalizar(DIAS[d.getDay()]);
}
/** "12 de octubre" */
function fechaLarga(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('es-CL', { day: 'numeric', month: 'long' });
}

// ============================================================================
// INICIO
// ============================================================================
/** Pasa los viajes de la versión anterior (solo localStorage) a la planilla. */
function migrarDatosAntiguos() {
  const viejo = leerLS(LS.legado, null);
  if (!viejo || typeof viejo !== 'object') return;
  Object.keys(viejo).forEach(usuario => {
    (viejo[usuario].viajes || []).forEach(v => {
      cola.push({ id: nuevoId(), tipo: 'agregarViaje', usuario: usuario, fecha: v.fecha, trayecto: 'Ida' });
    });
  });
  try { localStorage.removeItem(LS.legado); } catch (e) {}
  persistir();
}

migrarDatosAntiguos();
ir('inicio');
sincronizar();
setInterval(() => { if (document.visibilityState === 'visible') sincronizar(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
window.addEventListener('online', () => sincronizar());
</script>
